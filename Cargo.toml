[package]
name = "net-sniff"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
etherparse = "0.19.0"
pcap = "2.4.0"
ratatui = "0.30.0"
tokio = "1.49.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
maxminddb = "0.24"
reqwest = { version = "0.11", features = ["blocking", "json"] }
sysinfo = "0.30"
chrono = "0.4"
once_cell = "1.18"
libc = "0.2.183"
[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.16"
